version: 1
app: toko
build:
  dockerfile: Dockerfile
  context: .
run:
  port: 3000
  health: /healthz
  health_timeout_secs: 60
  memory: 256m
domains:
  - toko.sumopod.id
preview_domains:
  - toko-preview.sumopod.id
env:
  public:
    NODE_ENV: production
  secrets:
    - API_KEY
services:
  db:
    engine: postgres
    version: "16"
    backup:
      schedule: "0 2 * * *"
      keep: 7
