name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-release:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 runners keep the glibc requirement at 2.35 so the binary also runs on older distros (e.g. Debian 12, Raspberry Pi OS).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: skoci-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: skoci-linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: skoci-darwin-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            asset: skoci-darwin-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release -p skoci --locked --target ${{ matrix.target }}

      - name: Package asset
        run: |
          cp "target/${{ matrix.target }}/release/skoci" "${{ matrix.asset }}"
          strip "${{ matrix.asset }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          merge-multiple: true
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: 'dist/skoci-*'

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          for f in skoci-*; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/skoci-*
            install.sh
