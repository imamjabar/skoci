[workspace]
resolver = "2"
members = [
    "crates/skoci-api",
    "crates/skoci-core",
    "crates/skoci-proxy",
    "crates/skoci-node",
    "crates/skoci-control",
    "crates/skoci-client",
    "crates/skoci-cli",
    "crates/skoci-mcp",
    "crates/skoci",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
authors = ["Imam Jabar <imam@zen.ai.id>"]
license = "Apache-2.0"
repository = "https://github.com/imamjabar/skoci"
homepage = "https://github.com/imamjabar/skoci"
readme = "README.md"

[workspace.dependencies]
# Internal workspace crates
skoci-api = { path = "crates/skoci-api", version = "0.2.2" }
skoci-core = { path = "crates/skoci-core", version = "0.2.2" }
skoci-proxy = { path = "crates/skoci-proxy", version = "0.2.2" }
skoci-node = { path = "crates/skoci-node", version = "0.2.2" }
skoci-control = { path = "crates/skoci-control", version = "0.2.2" }
skoci-client = { path = "crates/skoci-client", version = "0.2.2" }
skoci-cli = { path = "crates/skoci-cli", version = "0.2.2" }
skoci-mcp = { path = "crates/skoci-mcp", version = "0.2.2" }

# Common async & network
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# CLI & UX
clap = { version = "4.5", features = ["derive", "env"] }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Storage & Crypto
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
rand = "0.8"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
libc = "0.2"

# Error & Utility
anyhow = "1.0"

# skoci-client / skoci-cli
tar = "0.4"
flate2 = "1.0"
ignore = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }

# skoci-proxy
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tokio", "webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
